name: Release on main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read plugin version
        id: version
        run: |
          VERSION="$(sed -n 's/^ \* Version:[[:space:]]*//p' mitstake-agent.php | head -n1 | tr -d '\r')"
          if [[ -z "$VERSION" ]]; then
            echo "Version non trovata in mitstake-agent.php"
            exit 1
          fi
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check tag exists
        id: tagcheck
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zip asset
        if: steps.tagcheck.outputs.exists == 'false'
        run: |
          mkdir -p dist/mitstake-agent
          rsync -a ./ dist/mitstake-agent/ \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "dist"
          (cd dist && zip -r "mitstake-agent-${{ steps.version.outputs.version }}.zip" "mitstake-agent")

      - name: Create GitHub release
        if: steps.tagcheck.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/mitstake-agent-${{ steps.version.outputs.version }}.zip
