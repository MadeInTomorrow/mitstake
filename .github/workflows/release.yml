name: Release Plugin

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read plugin version
        id: version
        run: |
          VERSION="$(sed -n 's/^ \* Version:[[:space:]]*//p' mitstake-agent/mitstake-agent.php | head -n1 | tr -d '\r')"
          if [[ -z "$VERSION" ]]; then
            echo "Version non trovata in mitstake-agent/mitstake-agent.php"
            exit 1
          fi
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check remote tag
        id: tagcheck
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release ZIP
        if: steps.tagcheck.outputs.exists == 'false'
        run: |
          mkdir -p dist
          rsync -a ./mitstake-agent/ dist/mitstake-agent/ \
            --exclude ".git" \
            --exclude ".github"
          (cd dist && zip -r "mitstake-agent.zip" "mitstake-agent")

      - name: Create GitHub release
        if: steps.tagcheck.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MiTstake Agent ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/mitstake-agent.zip
